version: "3.7"

services:
  app-dev:
    container_name: trmm-app-dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: /bin/sh -c "npm ci --cache ~/.npm && npm run serve"
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    ports:
      - "8080:443"
    networks:
      dev:
        aliases:
          - tactical-frontend

networks:
  dev:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_NETWORK}
