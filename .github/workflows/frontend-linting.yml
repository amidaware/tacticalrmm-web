name: Frontend checks
on:
  push:
    branches: [develop, final/i18n-rollout]
  pull_request:
    branches: [develop, final/i18n-rollout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared Node and GNU gettext environment
        run: docker build -t tacticalrmm-frontend-checks -f .devcontainer/Dockerfile .devcontainer
      - name: Install, validate and build from a clean checkout
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace" -w /workspace
          tacticalrmm-frontend-checks sh scripts/gettext/ci.sh
